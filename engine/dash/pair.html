<!doctype html>
<!-- META-CONTROLLER C6: the one page an unpaired remote device gets (SPEC sec. 5). No token, no data: a code from the desktop pairs it.
     META-PAIR-LOOK R1: in Norn's own look (norn/norn.css tokens, the Silkscreen pixel font, the carved 9-slice panel, the mark and
     wordmark from norn/art/) with the classic look when the dashboard's meta-look says so. SELF-CONTAINED on purpose: an unpaired
     device may load only this page and POST /api/remote/claim, so the font and the art are inlined (data: URLs) and the panel is
     drawn here from the palette (norn/pixel.mjs panelArt 'carved') - never a /norn/ or /vendor/ request (tests/pair-page.test.mjs). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><title>Norn - pair this device</title>
<script>
  // look (meta-look: norn | classic), ground (meta-theme, else the system), the integer art scale (pixel.mjs artScale) and the
  // carved panel art - all before the first paint, so the page never flashes in the wrong look
  (() => {
    const r = document.documentElement, darkQ = matchMedia('(prefers-color-scheme: dark)');
    const ls = k => { try { return localStorage.getItem(k); } catch { return null; } };
    const P = { void: '#0b0e1a', night: '#151c30', 'bark-deep': '#241a14', wood: '#6b4a30', oak: '#9c7048', gold: '#b8801e', vellum: '#f7f0dc', linen: '#c9b48c', ink: '#8c7656' };
    const panel = dark => {   // 24 x 24 art, slice 8: bevel + gilt notches + corner studs (pixel.mjs panelArt('carved'))
      const c = document.createElement('canvas'); c.width = c.height = 24; const x = c.getContext('2d'), dot = (col, i, j, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(i, j, w, h); };
      const [d0, d1, d2, hi] = dark ? [P['bark-deep'], P.wood, P.oak, P.gold] : [P.wood, P.oak, P.linen, P.gold];
      dot(dark ? P.night : P.vellum, 0, 0, 24, 24);
      for (let i = 0; i < 24; i++) for (let j = 0; j < 24; j++) {
        const b = Math.min(i, j, 23 - i, 23 - j); if (b > 4) continue;
        const along = (b === i || b === 23 - i) ? j : i;
        let col = b === 0 ? (dark ? P.void : P.ink) : b === 1 ? d1 : b === 2 ? d2 : b === 3 ? d1 : d0;
        if (b === 2 && along % 6 === 3) col = hi;
        dot(col, i, j);
      }
      for (const [ci, cj] of [[2, 2], [21, 2], [2, 21], [21, 21]]) dot(hi, ci - 1, cj - 1, 2, 2);
      return c.toDataURL();
    };
    const paint = () => {
      const theme = ls('meta-theme'), dark = theme === 'dark' || (theme !== 'light' && darkQ.matches);
      const d = devicePixelRatio > 0 ? devicePixelRatio : 1, k = Math.max(1, Math.round(2 * d));
      r.classList.toggle('norn', ls('meta-look') !== 'classic'); r.dataset.ground = dark ? 'dark' : 'light';
      r.style.setProperty('--px', k / d + 'px'); r.style.setProperty('--d1', 1 / d + 'px'); r.style.setProperty('--pn', `url(${panel(dark)})`);
    };
    paint(); darkQ.addEventListener('change', paint);
  })();
</script>

  /* the classic look (index.html :root tokens) */
  :root[data-ground=light] { --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --mute: #5d6672; --line: #e3e6ea; --soft: #eef1f4; --accent: #c2410c; --on-accent: #fff; --ok: #15803d; --bad: #b91c1c; --gold: #c2410c; --bevel: #c2410c; --dim: #5d6672; }
  :root[data-ground=dark] { --bg: #121417; --panel: #1a1d21; --ink: #e6e8eb; --mute: #9aa3ad; --line: #2b3036; --soft: #22262b; --accent: #fb923c; --on-accent: #fff; --ok: #4ade80; --bad: #f87171; --gold: #fb923c; --bevel: #fb923c; --dim: #9aa3ad; }
  /* the Norn look (norn/norn.css :root.norn tokens; palette only, no translucency) */
  :root.norn { --pix: 'Silkscreen', ui-monospace, monospace; }
  :root.norn[data-ground=dark] { --bg: #0b0e1a; --panel: #151c30; --ink: #d3e2ec; --mute: #93aec6; --line: #2e3f5f; --soft: #1f2b45; --accent: #e2683f;
    --on-accent: #0b0e1a; --ok: #94b44c; --bad: #e2683f; --gold: #eec24a; --bevel: #b8801e; --dim: #6380a0; }
  :root.norn[data-ground=light] { --bg: #e9dcbc; --panel: #f7f0dc; --ink: #241a14; --mute: #433021; --line: #c9b48c; --soft: #e9dcbc; --accent: #a5302e;
    --on-accent: #f7f0dc; --ok: #34431c; --bad: #a5302e; --gold: #6e430f; --bevel: #241a14; --dim: #6b4a30; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-wrap: anywhere; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; font-weight: 650; }
  .art { display: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  main { width: calc(100% - 32px); max-width: 460px; margin: 28px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 18px; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 8px 0; color: var(--mute); font-size: 15px; }
  p b { color: var(--ink); font-weight: 600; }
  label { display: block; margin: 18px 0 6px; font-size: 13px; color: var(--mute); }
  input { width: 100%; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  input::placeholder { color: var(--dim); opacity: 1; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
  #pair-code { font: 700 28px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; text-align: center; padding: 14px 8px; }
  button { margin-top: 20px; width: 100%; min-height: 52px; padding: 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button:disabled { cursor: default; opacity: .7; }
  #pair-out { min-height: 1.5em; margin-top: 12px; font-size: 14px; }
  .bad { color: var(--bad); } .ok { color: var(--ok); }
  small { display: block; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--mute); font-size: 13px; }

  /* ---------- Norn: the header bar of the dashboard (mark + wordmark), the carved gold-framed panel, pixel-font heads, the gold button ---------- */
  :root.norn .art { display: block; }
  :root.norn .classic { display: none; }
  :root.norn header { gap: calc(6 * var(--px)); padding: calc(5 * var(--px)) calc(8 * var(--px)); border-bottom: calc(2 * var(--px)) solid var(--line); }
  :root.norn .mark { width: calc(32 * var(--d1)); height: calc(32 * var(--d1)); }
  :root.norn .word { width: calc(160 * var(--d1)); height: calc(40 * var(--d1)); }
  :root.norn main { border: calc(8 * var(--px)) solid transparent; border-radius: 0; border-image: var(--pn) 8 fill / calc(8 * var(--px)) repeat;
    padding: calc(4 * var(--px)) calc(6 * var(--px)) calc(6 * var(--px)); background: none; }
  :root.norn .logo { width: calc(128 * var(--d1)); height: calc(128 * var(--d1)); margin: 0 auto calc(4 * var(--px)); }
  :root.norn h1, :root.norn label, :root.norn button { font-family: var(--pix); font-weight: 400; -webkit-font-smoothing: none; text-transform: uppercase; }
  :root.norn h1 { font-size: calc(8 * var(--px)); line-height: 1.25; letter-spacing: 0; text-align: center; color: var(--gold); margin-bottom: calc(4 * var(--px)); }
  :root.norn label { font-size: calc(5 * var(--px)); letter-spacing: 3px; color: var(--mute); }
  :root.norn input { border-radius: 0; border: calc(2 * var(--d1)) solid var(--line); }
  :root.norn input:focus { outline: calc(2 * var(--d1)) solid var(--gold); }
  :root.norn button { border-radius: 0; border: calc(2 * var(--d1)) solid var(--gold); background: var(--gold); color: var(--on-accent);
    font-size: calc(8 * var(--px)); letter-spacing: 4px; box-shadow: inset 0 calc(-2 * var(--px)) 0 var(--bevel); }
  :root.norn button:active { box-shadow: inset 0 calc(2 * var(--px)) 0 var(--bevel); }
  :root.norn button:disabled { opacity: 1; background: var(--soft); border-color: var(--line); color: var(--dim); box-shadow: none; }
  :root.norn small { border-top: calc(2 * var(--d1)) dashed var(--line); }
</style></head>

  <h1>Pair this device</h1>
  <p>Pair this device once. On your desktop dashboard: <b>Settings &gt; Notifications &gt; Reach Norn from your phone &gt; Pair a device</b>, then type the code shown there.</p>
  <form id="pair" autocomplete="off">
    <label for="pair-code">Pairing code</label>
    <input id="pair-code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD-EFGH" required>
    <label for="pair-name">Name for this device</label>
    <input id="pair-name" name="name" maxlength="40" placeholder="my phone">
    <button type="submit" id="pair-go">Pair</button>
    <div id="pair-out" role="status"></div>
  </form>
  <small>The code works once and for 10 minutes. This device is then remembered until you revoke it in Settings on the desktop.</small>
</main>
<script>
  const out = document.getElementById('pair-out'), go = document.getElementById('pair-go');
  const ua = navigator.userAgent, guess = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android phone' : 'phone';
  document.getElementById('pair-name').placeholder = guess;
  document.getElementById('pair').addEventListener('submit', async e => {
    e.preventDefault(); go.disabled = true; out.className = ''; out.textContent = 'Pairing ...';
    const code = document.getElementById('pair-code').value, name = document.getElementById('pair-name').value.trim() || guess;
    try {
      const r = await fetch('/api/remote/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, name }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      out.className = 'ok'; out.textContent = 'Paired. Opening Norn ...'; location.replace('/');
    } catch (err) { out.className = 'bad'; out.textContent = err.message; go.disabled = false; }
  });
</script>
